<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>LE SAS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#08090c; --card:#101218; --card2:#161923; --line:#20242e;
  --txt:#e9ecf2; --muted:#767d8c; --dim:#4a5160;
  --accent:#e8b13a; --good:#4ec97e; --bad:#e5484d; --blue:#5b8def;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding:0 18px calc(40px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,textarea{font-family:inherit}
.hidden{display:none!important}
h2{margin:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* Header */
header{padding:34px 0 6px}
.clock{font-size:52px;font-weight:200;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.date{color:var(--muted);font-size:14px;margin-top:6px;text-transform:capitalize}
.hstats{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted)}
.chip b{color:var(--txt)}
.xpbar{height:3px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:12px}
.xpbar>i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s}

/* Sections */
section{margin-top:30px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

/* Intention */
.intention{width:100%;background:none;border:none;color:var(--txt);font-size:25px;font-weight:700;
  line-height:1.3;letter-spacing:-.02em;resize:none;outline:none;padding:0;min-height:34px;overflow:hidden}
.intention::placeholder{color:var(--dim);font-weight:500}
.int-hint{color:var(--dim);font-size:12px;margin-top:8px}

/* Bloc en cours */
.block{border-left:2px solid var(--accent);padding:2px 0 2px 14px}
.block .now{font-size:19px;font-weight:700}
.block .time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.block.off{border-color:var(--line)}
.block.off .now{color:var(--muted);font-weight:600}

/* Tâches (one thing / boss) */
.task{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px}
.task.boss{border-color:#e5484d44}
.task.done{opacity:.5}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--dim);flex:0 0 auto;display:grid;
  place-items:center;font-size:14px;margin-top:1px;transition:.15s}
.task.done .box{background:var(--good);border-color:var(--good);color:#05230f}
.task.boss .box{border-color:#e5484d88}
.task.boss.done .box{background:var(--bad);border-color:var(--bad);color:#2a0509}
.task .tin{flex:1;min-width:0}
.task .lab{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.task.boss .lab{color:#e5484daa}
.task input.ttxt{width:100%;background:none;border:none;color:var(--txt);font-size:17px;font-weight:600;
  outline:none;padding:2px 0 0}
.task input.ttxt::placeholder{color:var(--dim);font-weight:500}
.task.done input.ttxt{text-decoration:line-through}

/* Quêtes */
.quest{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.quest.done{opacity:.45}
.quest .box{width:21px;height:21px;border-radius:6px;font-size:12px;margin:0}
.quest .qem{font-size:17px}
.quest .qlab{flex:1;font-size:15px;font-weight:600}
.quest.done .qlab{text-decoration:line-through}
.quest .go{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:800;color:var(--muted)}
.quest .go:active{background:var(--card2)}

/* Focus */
.focus{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:center}
.ftime{font-size:44px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.frow{display:flex;gap:8px;margin-top:14px}
.frow button{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:800;font-size:13px;color:var(--txt)}
.frow button.primary{background:var(--accent);color:#231a04;border-color:var(--accent)}
.fmin{color:var(--muted);font-size:12px;margin-top:10px}

/* Lanceur */
.launch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.app{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px;
  text-decoration:none;color:var(--txt);font-size:14px;font-weight:600}
a.app:active{background:var(--card2)}
a.app .em{font-size:16px}

/* Friction */
.fric{display:flex;flex-wrap:wrap;gap:8px}
.fric button{border:1px dashed #e5484d55;border-radius:20px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.fric button:active{background:#e5484d11}
.fric-count{color:var(--dim);font-size:12px;margin-top:10px}

/* Overlay */
.ov{position:fixed;inset:0;background:rgba(4,5,8,.94);backdrop-filter:blur(6px);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:22px}
.ovbox{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.ovbox h3{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.02em}
.ovbox p{color:var(--muted);font-size:14px;margin:0 0 14px}
.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;color:var(--txt);
  font-size:15px;padding:12px;outline:none;margin-bottom:10px;resize:vertical}
.field:focus{border-color:var(--accent)}
.btn{display:block;width:100%;border-radius:12px;padding:14px;font-weight:800;font-size:15px;text-align:center;margin-top:8px}
.btn.primary{background:var(--accent);color:#231a04}
.btn.ghost{border:1px solid var(--line);color:var(--muted)}
.btn.danger{border:1px solid #e5484d66;color:var(--bad)}
.btn:disabled{opacity:.35}
.cd{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}

/* Réglages */
.setrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow .qlab{flex:1;font-size:14px}
.tog{width:42px;height:24px;border-radius:20px;background:var(--card2);border:1px solid var(--line);position:relative;flex:0 0 auto}
.tog i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:.15s}
.tog.on{background:#e8b13a22;border-color:var(--accent)}
.tog.on i{left:21px;background:var(--accent)}

.done-day{text-align:center;padding:26px 0}
.done-day .em{font-size:44px}
.done-day .t{font-size:19px;font-weight:800;margin-top:6px}
.done-day .s{color:var(--muted);font-size:14px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
  padding:11px 18px;border-radius:24px;font-weight:700;font-size:14px;z-index:90;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.linkbtn{color:var(--dim);font-size:12px;font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=2"></script>
</body>
</html>
